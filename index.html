
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyT_RFw22nyXPILOu5lJW5PDVfSAYBrgwgEelLUxJkSY0GGWtWRDIPeTk1oRuCQd0iZ/exec";

const form = document.getElementById("registration");
const message = document.getElementById("message");
const submitButton = form.querySelector('button[type="submit"]');

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  if (!form.reportValidity()) return;

  submitButton.disabled = true;
  submitButton.textContent = "Registering...";
  message.textContent = "आपका रजिस्ट्रेशन भेजा जा रहा है...";

  try {
    const formData = new URLSearchParams(new FormData(form));

    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      body: formData
    });

    message.textContent =
      "रजिस्ट्रेशन अनुरोध भेज दिया गया है। कृपया आयोजक से पुष्टि करें।";

    form.reset();

  } catch (error) {
    message.textContent =
      "अनुरोध भेजने में समस्या हुई। इंटरनेट और Web App URL जाँचें।";
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Register Team";
  }
});
</script>
